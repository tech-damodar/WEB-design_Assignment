<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .sky {
            width: 100%;
            height: 100vh;
            background-image: url(sky.jpeg);
            background-repeat: no-repeat;
            background-size: cover;
        }

        .tree {
            width: 100%;
            height: 100vh;
            background-image: url(tree-removebg-preview\ \(1\).png);
            background-repeat: no-repeat;
            background-size: cover;
        }

        .track {
            width: 1000vw;
            height: 70px;
            background-image: url(track.jpeg);
            position: absolute;
            bottom: 2px;
            animation-name: run;
            animation-duration: 1s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        .car {
            width: 686px;
            height: 218px;
            background-image: url(car-removebg-preview.png);
            background-size: cover;
            position: absolute;
            bottom: 10px;
            left: 300px;
        }

        .wheel1 {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-image: url(wheel1-removebg-preview.png);
            background-size: cover;
            position: absolute;
            bottom: 0px;
            left: 394px;
            animation-name: gol;
            animation-duration: 2s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        .wheel2 {
            width: 127px;
            height: 127px;
            border-radius: 50%;
            background-image: url(wheel2-removebg-preview.png);
            background-size: cover;
            position: absolute;
            bottom: 0px;
            left: 787px;
            animation-name: gol;
            animation-duration: 2s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        @keyframes gol {
            from{

            }
            to{
                transform: rotate(360deg);
            }
            
        }
        @keyframes run {
            from{

            }
            to{
                transform: translateX(-500px);
            }
            
        }
    </style>
</head>

<body>
    <div class="sky">
        <div class="tree"></div>
        <div class="track"></div>
        <div class="car"></div>
        <div class="wheel1"></div>
        <div class="wheel2"></div>
    </div>
</body>

</html>
